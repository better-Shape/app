[package]
name = "app"
version = "1.0.3"
description = "BetterShape — agentic IDE"
authors = ["BetterShape"]
license = "BUSL-1.1"
repository = "https://github.com/Owie6789/BetterShape"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["protocol-asset", "unstable", "devtools", "webview-data-url", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
git2 = "0.20"
regex = "1"
fsindex = "0.3.1"
fst = "0.4.7"
nucleo-matcher = "0.3.1"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-toml-ng = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }
dotenvy = "0.15.7"
futures = "0.3.32"
walkdir = "2.5.0"
urlencoding = "2.1.3"
dirs = "5.0.1"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-tungstenite = "0.26"
backoff = { version = "0.4", features = ["tokio"] }
specta = { version = "2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.20", features = ["derive"] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
trash = "5.2.3"
uuid = { version = "1", features = ["v4"] }
open = "5"
base64 = "0.22"
sha2 = "0.10"
keyring = "3"
bincode = "1.3"
tauri-plugin-notification = "2"
tauri-plugin-process = "2.3.1"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tauri-winrt-notification = "0.8"
webview2-com = "0.38"
windows-core = "0.61"
window-vibrancy = "0.5"

# `notify` backs the editor's live file-change stream and is used ungated in
# commands/fs/mod.rs, so every desktop needs it. Backend is picked per-OS:
# ReadDirectoryChangesW / FSEvents / inotify.
[target."cfg(any(target_os = \"windows\", target_os = \"macos\", target_os = \"linux\"))".dependencies]
notify = "8.2.0"

# single-instance stays off macOS on purpose: a bundled .app is already
# single-instance via LaunchServices, and bettershape:// is handled by
# tauri-plugin-deep-link, which is registered on all platforms.
[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
