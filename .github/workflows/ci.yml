name: CI

on:
  pull_request:
    # Run on all PRs, not just targeting main - catches issues in feature branches too
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Fast feedback: lint, typecheck, formatting
  # ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: ESLint
        # Now 0 errors, 148 warnings. The remaining 148 are react-hooks/*
        # (set-state-in-effect, refs, preserve-manual-memoization, purity,
        # immutability), which this config deliberately downgrades to warnings
        # with a TODO to re-enable as errors after cleanup. Fixing them is a
        # cross-app refactor, not a lint change.
        # This step gates merges on errors only.
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint-report.txt
          STATUS=${PIPESTATUS[0]}
          ERRORS=$(grep -c " error " eslint-report.txt || echo 0)
          WARNINGS=$(grep -c " warning " eslint-report.txt || echo 0)
          echo "ESLint exit: $STATUS, errors: $ERRORS, warnings: $WARNINGS"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::ESLint found $ERRORS errors - must be fixed"
            exit $STATUS
          fi
          echo "✓ ESLint passed with $WARNINGS warnings (allowed, but should be reduced)"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check Next.js config & build preview script
        run: |
          node --check next.config.ts || true
          npm run build:runtime

      - name: Verify docs index can be generated
        run: |
          set -euo pipefail
          # Fail if docs:index fails unexpectedly - it's required for search
          if ! npm run docs:index; then
            echo "::error::docs:index failed - search index generation broken"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # JS tests (Vitest)
  # ─────────────────────────────────────────────────────────
  test-js:
    name: Test JS (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Build preview runtime
        run: npm run build:runtime

      - name: Vitest run with coverage
        run: npx vitest run --reporter=verbose --coverage --coverage.reporter=text --coverage.reporter=json-summary

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-js
          path: |
            coverage/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Browser E2E (Playwright, mocked Tauri backend)
  # ─────────────────────────────────────────────────────────
  # Runs the full UI in headless Chromium against the static Browser
  # Preview bundle (see e2e/README.md). NOT in ci-success `needs` yet —
  # additive while the suite is new, same as static-macos below. Promote
  # it into the gate once it has a few weeks of green history.
  test-e2e:
    name: Test Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Build Browser Preview bundle
        run: npm run build:preview

      - name: Install Chromium for Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Playwright (static bundle)
        # @visual baselines are OS/font-sensitive; they run locally for now.
        run: ./node_modules/.bin/playwright test --grep-invert @visual
        env:
          E2E_STATIC: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Static (non-Rust) checks on macOS
  # ─────────────────────────────────────────────────────────
  # Typecheck / lint / vitest only. Rust and the full Tauri compile stay on Ubuntu
  # and in build-installers.yml - a macOS Tauri compile is not cheap enough for a PR
  # gate. NOT in ci-success `needs`, so this is additive and cannot block a merge.
  static-macos:
    name: Static Checks (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Build preview runtime
        run: npm run build:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        # Same errors-only gate as the Ubuntu `lint` job: the react-hooks rules are
        # deliberately downgraded to warnings in eslint.config.cjs. This is a mirror,
        # not a relaxation.
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint-report.txt
          STATUS=${PIPESTATUS[0]}
          ERRORS=$(grep -c " error " eslint-report.txt || echo 0)
          WARNINGS=$(grep -c " warning " eslint-report.txt || echo 0)
          echo "ESLint exit: $STATUS, errors: $ERRORS, warnings: $WARNINGS"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::ESLint found $ERRORS errors - must be fixed"
            exit $STATUS
          fi
          echo "✓ ESLint passed with $WARNINGS warnings (allowed, but should be reduced)"

      - name: Vitest run
        run: npx vitest run

  # ─────────────────────────────────────────────────────────
  # Rust tests
  # ─────────────────────────────────────────────────────────
  test-rust:
    name: Test Rust (Cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "true"

      - run: npm ci --ignore-scripts

      - name: Build preview runtime
        run: npm run build:runtime

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --nocapture

  # ─────────────────────────────────────────────────────────
  # Rust lints: fmt + clippy + check
  # ─────────────────────────────────────────────────────────
  rust-lints:
    name: Rust Lints (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Cargo builds run PR-controlled build scripts. Keeping the checkout
          # token out of .git/config stops that code from using this job's
          # pull-requests:write / issues:write scopes.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "true"
          rust-components: "rustfmt,clippy"

      - name: Cargo fmt (check)
        run: |
          set -o pipefail
          if ! cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee fmt-check.txt; then
            echo "::error::Rust formatting check failed - run 'cargo fmt --manifest-path src-tauri/Cargo.toml --all' locally"
            echo "=== Diff ==="
            cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | head -n 200 || true
            echo "=== Files needing format ==="
            cargo fmt --manifest-path src-tauri/Cargo.toml --all -- -l 2>&1 | head -n 100 || true
            echo "=== Full fmt-check.txt ==="
            cat fmt-check.txt | head -n 200
            exit 1
          fi
          echo "✓ Rust formatting check passed"

      - name: Upload fmt check log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-fmt-check
          path: fmt-check.txt
          retention-days: 3

      - name: Cargo clippy (deny warnings)
        id: clippy
        run: |
          set -o pipefail
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee clippy-check.txt
          STATUS=${PIPESTATUS[0]}
          echo "Clippy exit: $STATUS"
          # Save status for next step
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # Show summary
          cat clippy-check.txt | tail -n 200
          # Exit with status to fail job if warnings
          exit $STATUS

      - name: Comment clippy results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('clippy-check.txt', 'utf8');
            } catch (e) {
              log = 'Failed to read clippy-check.txt: ' + e.message;
            }
            // Also write to summary for artifact-free debugging
            const summary = `### Clippy Check Failed\n\n\`\`\`\n${log.slice(0, 50000)}\n\`\`\`\n`;
            try {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            } catch(e) {
              core.info('Failed to write summary: ' + e.message);
            }
            const truncated = log.slice(0, 60000);
            const body = `### 🔴 Clippy Check Failed\n\nClippy found warnings that must be fixed:\n\n\`\`\`\n${truncated}\n\`\`\`\n\nPlease run \`cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings\` locally and fix.`;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (e) {
              core.warning('Failed to create comment: ' + e.message);
            }

      - name: Upload clippy log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-check
          path: clippy-check.txt
          retention-days: 3

      - name: Cargo check (all features)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features

  # ─────────────────────────────────────────────────────────
  # Build verification (Next.js export)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Build preview runtime
        run: npm run build:runtime

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SHAPE_RELEASE: "ci"

      - name: Check build output
        run: |
          ls -lah out || ls -lah .next
          du -sh out 2>/dev/null || du -sh .next

      - name: Upload build artifact (for debugging)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-build-output
          path: |
            out
            .next
          if-no-files-found: ignore
          retention-days: 3

  # ─────────────────────────────────────────────────────────
  # Version sync check
  # ─────────────────────────────────────────────────────────
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Check version files are in sync
        run: node scripts/release/version.mjs --check

  # ─────────────────────────────────────────────────────────
  # Lightweight security audit (npm + cargo)
  # ─────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: npm audit (high+)
        run: npm audit --audit-level=high || (echo "::warning::npm audit found high severity issues"; exit 0)

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock || (echo "::warning::cargo audit found issues"; exit 0)

  # ─────────────────────────────────────────────────────────
  # Final gate: all required jobs must pass
  # ─────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test-js, test-rust, rust-lints, build, version-sync]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then echo "lint failed"; exit 1; fi
          if [[ "${{ needs.test-js.result }}" != "success" ]]; then echo "test-js failed"; exit 1; fi
          if [[ "${{ needs.test-rust.result }}" != "success" ]]; then echo "test-rust failed"; exit 1; fi
          if [[ "${{ needs.rust-lints.result }}" != "success" ]]; then echo "rust-lints failed"; exit 1; fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then echo "build failed"; exit 1; fi
          if [[ "${{ needs.version-sync.result }}" != "success" ]]; then echo "version-sync failed"; exit 1; fi
          echo "✓ All CI checks passed"
