name: Rust fix (temporary)

# Temporary helper: formats the crate and writes compiler errors into the branch
# so they can be fixed from an environment without a Rust toolchain.
# Deleted before the branch is finished.
on:
  push:
    branches:
      - arena/0c0f702a-shape

permissions:
  contents: write

jobs:
  fix:
    name: Format + collect errors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "true"
          rust-components: "rustfmt,clippy"

      - run: npm ci

      - name: Build preview runtime
        run: npm run build:runtime

      - name: Format the crate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all || true

      - name: Collect compiler errors
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --all-features --message-format=short --tests 2>&1 \
            | tee rust-check.txt || true

      - name: Collect clippy findings
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 \
            | tee clippy-check.txt || true

      - name: Collect fmt diff
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee fmt-check.txt || true

      - name: Collect test failures
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --all-features 2>&1 | tee test-report.txt || true

      - name: Trim the reports
        run: |
          for f in rust-check.txt clippy-check.txt fmt-check.txt test-report.txt; do
            tail -c 200000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            wc -l "$f"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bettershape-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: rustfmt + compiler report (temporary workflow)"
            git push origin HEAD:${{ github.ref_name }}
          fi
