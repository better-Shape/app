name: Nightly

# Manual only: no schedule, and dispatch accepts no user-defined inputs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Nightly Build Check (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: ""
            bundles: nsis
          - runner: windows-11-arm
            os: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: macos-latest
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: dmg
          # Build Intel natively so OpenSSL's x86_64 pkg-config/sysroot is available.
          - runner: macos-26-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    env:
      # AppImage bundling runs the downloaded linuxdeploy AppImages, which need FUSE2.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          rust-targets: ${{ matrix.target }}
          install-system-deps: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          cache-key: nightly-${{ matrix.arch }}

      - run: npm ci

      - name: Generate nightly version (for build)
        id: nightly-version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          NIGHTLY="${BASE}-nightly.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $NIGHTLY"
          # Save version to file for publish job to use (avoids midnight crossing mismatch)
          mkdir -p dist
          echo "$NIGHTLY" > dist/version.txt
          echo "$NIGHTLY" > dist/nightly-version.txt
          # Set package.json to nightly version so installers embed correct version
          node -e "
            const fs=require('fs');
            const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version='${NIGHTLY}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)+'\n');
          "
          echo "Updated package.json to $NIGHTLY"

      - name: Sync version
        run: npm run sync-version

      - name: Build runtime
        run: npm run build:runtime

      - name: Build Tauri (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Skip build if secrets missing (nightly placeholder case) - but don't hide real failures
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::warning::Secrets missing, skipping nightly build (expected for forks without secrets)"
            mkdir -p dist/nightly-placeholder
            echo "No secrets - build skipped" > dist/nightly-placeholder/README.txt
            exit 0
          fi
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri -- build --bundles nsis --target "${{ matrix.target }}"
          else
            npm run tauri -- build --bundles nsis
          fi

      - name: Build Tauri (macOS/Linux)
        # No signing secrets needed: bundle.createUpdaterArtifacts is false and there
        # is no tauri-plugin-updater in the dependency tree. Nightly mac/Linux builds
        # therefore run even in a fork that has no secrets - the Windows entries above
        # keep producing the placeholder that publish-nightly already knows to skip.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: Verify build output exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "dist/nightly-placeholder" ]; then
            echo "Build was skipped due to missing secrets - placeholder exists"
            exit 0
          fi
          if [ -n "${{ matrix.target }}" ]; then
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi
          # Check for the expected installer for this platform
          if ! find "$BUNDLE_DIR" -maxdepth 2 -type f \
                \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
                -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No installer found after build under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "✓ Installer found"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            dist/nightly-placeholder/
            dist/version.txt
            dist/nightly-version.txt
          if-no-files-found: error
          retention-days: 3

  # A manual run always publishes the nightly prerelease; dispatch inputs stay empty.
  publish-nightly:
    name: Publish Nightly Prerelease
    if: github.event_name == 'workflow_dispatch'
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/nightly
          merge-multiple: true

      - name: Determine nightly version from artifacts
        id: version
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          # Look for version file in multiple possible locations (artifacts may be nested)
          VERSION_FILE=""
          for candidate in \
            "dist/nightly/version.txt" \
            "dist/nightly/dist/version.txt" \
            "dist/nightly/nightly-version.txt" \
            "dist/nightly/dist/nightly-version.txt" \
            "dist/version.txt" \
            "dist/nightly-version.txt"; do
            if [ -f "$candidate" ]; then
              VERSION_FILE="$candidate"
              break
            fi
          done
          # Also search recursively
          if [ -z "$VERSION_FILE" ]; then
            FOUND=$(find dist/nightly -name "version.txt" -o -name "nightly-version.txt" 2>/dev/null | head -n1 || true)
            if [ -n "$FOUND" ]; then
              VERSION_FILE="$FOUND"
            fi
          fi
          if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            NIGHTLY=$(cat "$VERSION_FILE")
            echo "Using version from artifact $VERSION_FILE: $NIGHTLY"
          else
            # Fallback: use date, but warn about midnight crossing risk
            NIGHTLY="${BASE}-nightly.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
            echo "::warning::No version.txt found in artifacts (searched dist/nightly), using recomputed $NIGHTLY - may mismatch installers if crossing midnight"
            echo "Searched: dist/nightly/version.txt, dist/version.txt, and recursive find"
            ls -R dist/nightly 2>/dev/null | head -n 50 || true
          fi
          echo "version=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $NIGHTLY"

      - name: List artifacts
        run: |
          find dist/nightly -type f -exec ls -lh {} \; 2>/dev/null || echo "No artifacts"
          if [ -f "dist/nightly/README.txt" ]; then
            echo "Placeholder build detected - skipping publish"
          fi

      - name: Publish nightly release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Skip if placeholder (no real build)
          if [ -f "dist/nightly/README.txt" ]; then
            echo "Placeholder build - no real artifacts, skipping publish"
            exit 0
          fi
          if [ -z "$(find dist/nightly -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "No artifacts to publish - skipping"
            exit 0
          fi
          # Ensure we have actual installers (recursive search, not just top-level).
          # Platform-agnostic: Windows .exe plus macOS .dmg and Linux .deb/.rpm/.AppImage.
          if ! find dist/nightly -type f \
                \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
                -print -quit | grep -q .; then
            echo "::error::No installers found in artifacts"
            find dist/nightly -type f | head -n 20 || true
            exit 1
          fi
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping"
            exit 0
          fi
          # Use recursive find to collect installers in nested directories (artifacts retain structure)
          mapfile -t INSTALLERS < <(find dist/nightly -type f \
                \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \))
          if [ ${#INSTALLERS[@]} -eq 0 ]; then
            echo "::error::No installer files found"
            exit 1
          fi
          echo "Found ${#INSTALLERS[@]} installer files: ${INSTALLERS[*]}"
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --title "Nightly ${{ steps.version.outputs.version }}" \
            --notes "Manual nightly build from ${{ github.sha }}. Not for production use." \
            --prerelease \
            --draft \
            "${INSTALLERS[@]}"
