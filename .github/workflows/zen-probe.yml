name: Zen Probe

# Temporary diagnostic: find the exact headers OpenCode Zen's free tier needs.
# Runs only when this file itself changes, posts findings as a PR comment, and is
# deleted once the contract is known.
on:
  push:
    paths:
      - ".github/workflows/zen-probe.yml"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        run: |
          set -uo pipefail
          exec > /tmp/probe.txt 2>&1
          BASE=https://opencode.ai/zen/v1
          TOOLS='[{"type":"function","function":{"name":"read_file","description":"Read a file","parameters":{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}}}]'
          SESS="ses_$(openssl rand -hex 16)"

          echo "## Zen probe"
          echo
          echo "date: $(date -u)"
          echo

          probe() {
            local name="$1"; local model="$2"; local stream="$3"; shift 3
            local code
            code=$(curl -sS -m 60 -o /tmp/body -w '%{http_code}' -X POST "$BASE/chat/completions" \
              -H 'Content-Type: application/json' "$@" \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a coding agent.\"},{\"role\":\"user\",\"content\":\"Reply OK\"}],\"stream\":$stream,\"max_tokens\":32,\"tools\":$TOOLS}" 2>/tmp/err || true)
            echo "- **$name** ($model, stream=$stream) -> HTTP $code"
            if [ -s /tmp/err ]; then echo "  - curl: $(head -c 160 /tmp/err)"; fi
            echo "  - body: $(head -c 300 /tmp/body | tr -d '\r\n' | sed 's/```//g')"
          }

          echo "### Free model, no credentials"
          probe "bare" "ling-3.1-flash-free" true
          probe "better shape UA (what the app sends today)" "ling-3.1-flash-free" true -H "User-Agent: BetterShape/1.0.0"
          probe "bearer public" "ling-3.1-flash-free" true -H "Authorization: Bearer public"
          probe "opencode UA" "ling-3.1-flash-free" true -H "User-Agent: opencode/latest/1.3.15/cli"
          probe "opencode UA + session header" "ling-3.1-flash-free" true -H "User-Agent: opencode/latest/1.3.15/cli" -H "x-opencode-session: $SESS"
          probe "full opencode identity" "ling-3.1-flash-free" true \
            -H "User-Agent: opencode/latest/1.3.15/cli" \
            -H "x-opencode-client: cli" \
            -H "x-opencode-session: $SESS" \
            -H "x-opencode-session-id: $SESS" \
            -H "x-session-affinity: $SESS" \
            -H "X-Session-Id: $SESS" \
            -H "x-opencode-project: probe"
          echo
          echo "### Non-streaming (titles, summaries) with full identity"
          probe "non-stream" "ling-3.1-flash-free" false \
            -H "User-Agent: opencode/latest/1.3.15/cli" -H "x-opencode-client: cli" -H "x-opencode-session: $SESS"
          echo
          echo "### Paid model, anonymous"
          probe "paid anonymous" "claude-haiku-4-5" true -H "User-Agent: opencode/latest/1.3.15/cli" -H "x-opencode-session: $SESS"
          echo
          echo "### Go endpoint"
          for path in "go/v1/chat/completions" "go/v1/usage"; do
            if [ "${path##*/}" = "usage" ]; then
              code=$(curl -sS -m 30 -o /tmp/gobody -w '%{http_code}' "https://opencode.ai/zen/$path" || true)
            else
              code=$(curl -sS -m 60 -o /tmp/gobody -w '%{http_code}' -X POST "https://opencode.ai/zen/$path" \
                -H 'Content-Type: application/json' -H "User-Agent: opencode/latest/1.3.15/cli" -H "x-opencode-session: $SESS" \
                -d '{"model":"longcat-2.5-preview-free","messages":[{"role":"user","content":"Reply OK"}],"stream":true,"max_tokens":16}' || true)
            fi
            echo "- **POST/GET $path** -> HTTP $code"
            echo "  - body: $(head -c 300 /tmp/gobody | tr -d '\r\n' | sed 's/```//g')"
          done
          echo
          echo "### Streaming body, first bytes"
          echo '```'
          curl -sS -N -m 60 -X POST "$BASE/chat/completions" \
            -H 'Content-Type: application/json' -H "User-Agent: opencode/latest/1.3.15/cli" -H "x-opencode-client: cli" -H "x-opencode-session: $SESS" \
            -d '{"model":"ling-3.1-flash-free","messages":[{"role":"user","content":"Reply with one word: pong"}],"stream":true,"max_tokens":24}' \
            | head -12 || true
          echo '```'

      - name: Post findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "<!-- zen-probe -->"
            cat /tmp/probe.txt
          } > /tmp/comment.md
          gh api -X POST "repos/${{ github.repository }}/issues/7/comments" -F body=@/tmp/comment.md >/dev/null && echo "posted"
