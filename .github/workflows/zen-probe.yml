name: Zen Probe

# Temporary diagnostic: how OpenCode Zen behaves with a real key.
# Reads the key from a repository secret (never from the repo), posts findings to
# a file on the branch, and is deleted once the contract is known.
on:
  push:
    paths:
      - ".github/workflows/zen-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        env:
          ZEN_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          set -uo pipefail
          exec > /tmp/probe.txt 2>&1
          if [ -z "${ZEN_KEY:-}" ]; then
            echo "## Zen probe (keyed)"
            echo
            echo "No ZEN_API_KEY secret is set, so nothing was tested."
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 0
          fi
          echo "::add-mask::$ZEN_KEY"
          AUTH="Authorization: Bearer $ZEN_KEY"
          BASE=https://opencode.ai/inference/v1
          TOOLS='[{"type":"function","function":{"name":"read_file","description":"Read a file","parameters":{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}}}]'
          SESS="ses_$(openssl rand -hex 16)"

          echo "## Zen probe (keyed)"
          echo
          echo "date: $(date -u)"
          echo

          probe() {
            local label="$1"; local url="$2"; local model="$3"; local stream="$4"; shift 4
            local code
            code=$(curl -sS -m 90 -o /tmp/body -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' -H "$AUTH" "$@" \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a coding agent.\"},{\"role\":\"user\",\"content\":\"Reply with the single word: ok\"}],\"stream\":$stream,\"max_tokens\":64,\"tools\":$TOOLS}" 2>/tmp/err || true)
            echo "- **$label** ($model, stream=$stream) -> HTTP $code"
            if [ -s /tmp/err ]; then echo "  - curl: $(head -c 200 /tmp/err)"; fi
            echo "  - body: $(head -c 400 /tmp/body | tr -d '\r\n' | sed 's/```//g')"
          }

          echo "### Does the key unlock the free models?"
          probe "free model, plain UA" "$BASE/chat/completions" "ling-3.1-flash-free" true
          probe "free model, opencode UA + identity" "$BASE/chat/completions" "ling-3.1-flash-free" true \
            -H "User-Agent: opencode/latest/2.0.28/cli" -H "x-opencode-client: cli" -H "x-opencode-session: $SESS"
          probe "free model, non-streaming" "$BASE/chat/completions" "ling-3.1-flash-free" false

          echo
          echo "### Paid models on the chat/completions wire"
          probe "deepseek v4 flash" "$BASE/chat/completions" "deepseek-v4-flash" true
          probe "qwen3.8 max" "$BASE/chat/completions" "qwen3.8-max" true
          probe "minimax m2.7" "$BASE/chat/completions" "minimax-m2.7" true

          echo
          echo "### Model list with the key (compared with the anonymous one)"
          code=$(curl -sS -m 60 -o /tmp/models -w '%{http_code}' "$BASE/models" -H "$AUTH" || true)
          echo "- GET /models -> HTTP $code, $(grep -o '"id"' /tmp/models | wc -l) entries"
          echo "  - free ids: $(grep -o '"id":"[^"]*-free"' /tmp/models | sed 's/"id":"//;s/"//' | tr '\n' ' ')"

          echo
          echo "### Anthropic wire (what the zen-messages preset uses)"
          code=$(curl -sS -m 90 -o /tmp/anth -w '%{http_code}' -X POST "$BASE/messages" \
            -H 'Content-Type: application/json' -H "x-api-key: $ZEN_KEY" -H 'anthropic-version: 2023-06-01' \
            -d '{"model":"claude-haiku-4-5","max_tokens":64,"messages":[{"role":"user","content":"Reply with the single word: ok"}]}' || true)
          echo "- **claude-haiku-4-5 via /messages** -> HTTP $code"
          echo "  - body: $(head -c 300 /tmp/anth | tr -d '\r\n')"

          echo
          echo "### Go subscription endpoint"
          code=$(curl -sS -m 90 -o /tmp/go -w '%{http_code}' -X POST "https://opencode.ai/zen/go/v1/chat/completions" \
            -H 'Content-Type: application/json' -H "$AUTH" -H "User-Agent: opencode/latest/2.0.28/cli" -H "x-opencode-session: $SESS" \
            -d '{"model":"longcat-2.5-preview-free","messages":[{"role":"user","content":"Reply with the single word: ok"}],"stream":true,"max_tokens":32}' || true)
          echo "- **go/v1 longcat-2.5-preview-free** -> HTTP $code"
          echo "  - body: $(head -c 300 /tmp/go | tr -d '\r\n')"
          code=$(curl -sS -m 30 -o /tmp/usage -w '%{http_code}' "https://opencode.ai/zen/go/v1/usage" -H "$AUTH" || true)
          echo "- **GET go/v1/usage** -> HTTP $code"
          echo "  - body: $(head -c 300 /tmp/usage | tr -d '\r\n')"

          echo
          echo "### Streaming bytes (first lines of a real completion)"
          echo '```'
          curl -sS -N -m 90 -X POST "$BASE/chat/completions" \
            -H 'Content-Type: application/json' -H "$AUTH" -H "User-Agent: opencode/latest/2.0.28/cli" -H "x-opencode-session: $SESS" \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Reply with one word: pong"}],"stream":true,"max_tokens":24}' \
            | head -14 || true
          echo '```'

      - name: Publish findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          B64=$(base64 -w0 /tmp/probe.txt)
          gh api --method PUT "repos/${{ github.repository }}/contents/zen-probe-output.txt" \
            --field message="chore: zen probe output" \
            --field branch="${{ github.ref_name }}" \
            --field content="$B64" >/dev/null && echo "file written" || echo "file write failed"
          exit 0
