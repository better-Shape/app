name: Build Installers (Test)

# Produces downloadable installers so a human can TEST-INSTALL them on macOS and
# Linux. This workflow NEVER publishes anything: no release, no tag, no write scope.
# It is deliberately NOT a required status check, so it can never block a merge.
on:
  pull_request:
  push:
    branches:
      - mega/absorb-all
      - "draft/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let cold native builds finish; newer pending runs coalesce instead of
  # restarting Intel compilation on every review-fix push.
  cancel-in-progress: false

jobs:
  build:
    name: Build Installer (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: ""
            bundles: nsis
          - runner: windows-11-arm
            os: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            bundles: nsis
          # Use native runners for both architectures; SDK slices alone do not
          # cross-compile native dependencies such as OpenSSL.
          - runner: macos-latest
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    env:
      # AppImage bundling runs the linuxdeploy AppImages tauri downloads, and those
      # need FUSE2. Not every runner image ships it; extracting is the fallback.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          rust-targets: ${{ matrix.target }}
          install-system-deps: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          cache-key: installers-${{ matrix.arch }}

      - name: Install locked dependencies
        # Native Windows ARM npm ci --ignore-scripts took 17m10s in run 38613470080. Keep a
        # bounded step, but allow measured successful installs enough headroom.
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Build runtime
        run: npm run build:runtime

      # No TAURI_SIGNING_PRIVATE_KEY: bundle.createUpdaterArtifacts is false and there
      # is no tauri-plugin-updater in the dependency tree, so no platform here needs an
      # updater signature. That keeps this workflow usable on forks with no secrets.
      - name: Build Tauri bundle
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(build --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then ARGS+=(--target "${{ matrix.target }}"); fi
          npm run tauri -- "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Report native build failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/tauri-build.log" ]; then
            node scripts/build/report-failure.mjs < "$RUNNER_TEMP/tauri-build.log"
          fi

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-log-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/tauri-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi
          node scripts/build/collect-installers.mjs "$BUNDLE_DIR" dist/test-install "${{ matrix.bundles }}"
          ls -lh dist/test-install

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettershape-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/test-install/*
          if-no-files-found: error
          retention-days: 14

      - name: Step summary
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="bettershape-${{ matrix.os }}-${{ matrix.arch }}"
          {
            echo "## Installer: \`$ARTIFACT\`"
            echo ""
            echo "Platform: ${{ matrix.os }} / ${{ matrix.arch }}  |  Runner: \`${{ matrix.runner }}\`  |  Rust target: \`${{ matrix.target || 'host default' }}\`"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this workflow run."
            echo ""
            echo "### Contents"
            echo ""
            find dist/test-install -type f -exec ls -lh {} \; | awk '{print "- `" $9 "` (" $5 ")"}'
            echo ""
            echo "Verify downloads against \`SHA256SUMS.txt\` in this artifact."
            echo ""
            echo "_Unsigned test build. Not for production use._"
          } >> "$GITHUB_STEP_SUMMARY"
