name: Rust Diag

# Temporary: publishes what cargo actually says, since run logs are not readable
# from the sandbox. Deleted once the branch is green.
on:
  push:
    paths:
      - ".github/workflows/rust-diag.yml"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "true"
          rust-components: "rustfmt,clippy"
      - name: Collect
        continue-on-error: true
        run: |
          set +e
          exec > /tmp/diag.txt 2>&1
          cd src-tauri
          OUT=/tmp/diag.txt

          echo "### cargo fmt --check"
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1
          echo "exit=$?"; head -60 /tmp/fmt.txt
          echo

          echo "### cargo test --all-features"
          cargo test --all-features 2>&1 | tee /tmp/test.txt | grep -aE "^(error|warning: unused)|^test .* FAILED|panicked at|^failures:|^---- .* stdout ----|^test result:" | head -120
          echo "test exit=${PIPESTATUS[0]}"
          echo
          echo "### failing test names"
          grep -aA2 "^failures:" /tmp/test.txt | head -60
          echo
          echo "### clippy"
          cargo clippy --all-targets --all-features 2>&1 | tee /tmp/clippy.txt | grep -aE "^error|^warning" | head -80
          echo "clippy exit=${PIPESTATUS[0]}"
          echo "### done"
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          B64=$(base64 -w0 /tmp/diag.txt)
          SHA=$(gh api "repos/${{ github.repository }}/contents/rust-diag-output.txt?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || echo "")
          ARGS="--method PUT repos/${{ github.repository }}/contents/rust-diag-output.txt --field message=chore:_rust_diagnostics --field branch=${{ github.ref_name }} --field content=$B64"
          if [ -n "$SHA" ]; then ARGS="$ARGS --field sha=$SHA"; fi
          gh api $(echo $ARGS) >/dev/null && echo written || echo failed
          exit 0
