version = 1

# Test files are analyzed as tests, not held to production rules.
test_patterns = [
  "tests/**",
  "e2e/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser", "vitest"]
  # The repo is ESM ("type": "module" in package.json), so a .js file is a module.
  module_system = "es-modules"
  # Where package.json and tsconfig.json sit. The three "Parsing error ... 'sourceType:
  # module'" alerts on the run page are that parse mode rather than code: they follow
  # eslint.config.js and the two scripts under scripts/motion, and they survived both
  # this option and a rename from .mjs to .js.
  dependency_file_paths = ["."]
  # JS-D1001 demands a doc comment on every function. AGENTS.md forbids
  # comments that restate the code and reserves them for non-obvious
  # constraints, provenance, and workarounds. Skip the construct classes
  # where the metric would force boilerplate: internal arrow helpers,
  # local callbacks, method definitions, and class expressions. Exported
  # declarations keep the requirement.
  skip_doc_coverage = ["arrow-function-expression", "function-expression", "method-definition", "class-expression"]

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
